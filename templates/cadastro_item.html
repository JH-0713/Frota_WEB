{% extends 'base.html' %}

{% block content %}
<div class="topbar">
    <div>
        <h1>Cadastro de Item</h1>
        <p class="subtitulo">Insira os dados da novo item para integrá-la à frota ativa.</p>
    </div>
</div>

<form action="{{url_for('cadastrar_item')}}" method="post">
    <div class="form-container">

        <div class="form-linha">
            <div class="form-campo">
                <label for="placa">NOME DO ITEM</label>
                <input id="placa" name="form_nome" type="text" placeholder="Ex: Giroflex">
            </div>

        </div>
        <div class="form-linha">
            <div class="form-campo">
                <label for="email">DESCRIÇÃO</label>
                <textarea id="email" name="form_descricao" rows="1" style="resize: none"
                          placeholder="Ex: Dispositivo luminoso rotativo ou intermitente"></textarea>
            </div>
        </div>
        <div class="form-linha">
            <div class="form-campo">
                <label for="categoria">CATEGORIA</label>
                <select name="form_categoria" id="categoria">
                    <option value="none">Selecione uma categoria</option>
                    {% for i in var_categoria %}
                    <option value="{{i['id_categoria']}}">{{i['nome_categoria']}}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-campo full">
            <label for="valor">VALOR</label>
            <input id="valor" name="form_valor" type="text" placeholder="Ex: 150">
        </div>

        <!-- BOTÃO -->
        <div class="form-acoes">
            <a class="btn-salvar bg-danger" href="{{url_for('listar_itens')}}" type="button">Voltar</a>
            <button class="btn-salvar bg-info" type="submit">Salvar Item</button>
        </div>

    </div>
</form>


{% endblock content %}
