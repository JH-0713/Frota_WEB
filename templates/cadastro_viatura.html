{% extends 'base.html' %}

{% block content %}


<!-- TOPBAR INTERNO -->
<div class="topbar">
    <div>
        <h1>Cadastro de Viaturas</h1>
        <p class="subtitulo">Insira os dados da nova viatura para integrá-la à frota ativa.</p>
    </div>
</div>

<!-- FORMULÁRIO -->
<form action="{{url_for('cadastrar_viatura')}}" method="post">
    <div class="form-container">

        <div class="form-linha">
            <div class="form-campo">
                <label for="placa">PLACA</label>
                <input id="placa" name="form_placa" type="text" placeholder="Ex: ABC1D23">
            </div>

        </div>

        <div class="form-linha">
            <div class="form-campo">
                <label for="ano">ANO DE FABRICAÇÃO</label>
                <input id="ano" name="form_ano" type="text" placeholder="YYYY">
            </div>
            <div class="form-campo">
                <label for="odometro">ODÔMETRO INICIAL (KM)</label>
                <input id="odometro" name="form_km_atual" type="number" placeholder="0">
            </div>

        </div>

        <div class="form-campo full">
            <label for="modelo">MODELO DA VIATURA</label>
            <select id="modelo" name="form_modelo">
                <option value="None" selected>Selecione o modelo...</option>
                {% for i in var_modelos %}
                <option value="{{i.id_carro}}">{{i.marca}} - {{i.modelo}}</option>
                {% endfor %}
            </select>
        </div>

        <!-- BOTÃO -->
        <div class="form-acoes">
            <a class="btn-salvar bg-danger" href="{{url_for('listar_viatura')}}" type="button">Voltar</a>
            <button class="btn-salvar bg-info" type="submit">Salvar Viatura</button>
        </div>

    </div>
</form>


{% endblock content %}
