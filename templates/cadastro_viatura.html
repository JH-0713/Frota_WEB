{% extends 'base.html' %}

{% block content %}


<!-- TOPBAR INTERNO -->
<div class="topbar">
    <div>
        <h1>Cadastro de Viaturas</h1>
        <p class="subtitulo">Insira os dados da nova viatura para integrá-la à frota ativa.</p>
    </div>
</div>

<!-- FORMULÁRIO -->
<form action="{{url_for('cadastrar_viatura')}}" method="post">
    <div class="form-container">

        <div class="form-linha">
            <div class="form-campo">
                <label for="placa">PLACA</label>
                <input id="placa" name="form_placa" type="text" placeholder="Ex: ABC1D23">
            </div>

        </div>

        <div class="form-linha">
            <div class="form-campo">
                <label for="ano">ANO DE FABRICAÇÃO</label>
                <input id="ano" name="form_ano" type="text" placeholder="YYYY">
            </div>
            <div class="form-campo">
                <label for="odometro">ODÔMETRO INICIAL (KM)</label>
                <input id="odometro" name="form_km_atual" type="number" placeholder="0">
            </div>

        </div>

        <div class="form-campo full">
            <label for="modelo">MODELO DA VIATURA</label>
            <select id="modelo" name="form_modelo">
                <option value="None" selected>Selecione o modelo...</option>
                {% for i in var_modelos %}
                <option value="{{i.id_carro}}">{{i.marca}} - {{i.modelo}}</option>
                {% endfor %}
            </select>
        </div>

        <!-- BOTÃO -->
        <div class="form-acoes">
            <a class="btn-salvar bg-danger" href="{{url_for('listar_viatura')}}" type="button">Voltar</a>
            <button class="btn-salvar bg-info" type="submit">Salvar Viatura</button>
        </div>

    </div>
</form>

<div class="modal fade" id="cadastro_modelo" tabindex="-1"
     aria-labelledby="mostrar_cadastrar_modelo"
     aria-hidden="true">
    <form id="form-editar" action="{{ url_for('cadastrar_modelo') }}"
          method="post">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="mostrar_cadastrar_modelo"><i
                            class="bi bi-pencil-square text-primary fs-6"></i> Cadastar Modelo
                    </h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"
                            aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <label>
                        Modelo:
                        <input type="text" name="form_modelo">
                    </label>
                    <label>
                        Marca:
                        <input type="text" name="form_marca">
                    </label>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-info">Cadastrar
                    </button>
                    <button type="button" class="btn btn-secondary"
                            data-bs-dismiss="modal">Fechar
                    </button>
                </div>
            </div>
        </div>
    </form>
</div>

{% endblock content %}
