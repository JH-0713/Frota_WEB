{% extends 'base.html' %}

{% block content %}

<main class="dashboard-content">

    <div class="form-centralizado">
        <div class="form-card">

            <!-- ÍCONE -->
            <div><img class="form-icone-topo" src="../static/image/profile.png" alt="profile police"></div>

            <!-- TÍTULO -->
            <h2 class="form-titulo">Cadastro de Policial</h2>
            <p class="form-subtitulo">Insira os dados do oficial para registrá-lo no sistema de frota.</p>

            <!-- CAMPOS -->
            <div class="form-linha">
                <div class="form-campo">
                    <label>Matrícula</label>
                    <div class="input-com-icone">
                        <img class="input-icone" src="../static/image/logoDepartamento.png " alt="Ícone de Departamento"
                             width="20" height="20">
                        <input name="form_matricula" type="text" placeholder="000.000-0">
                    </div>
                </div>
                <div class="form-campo">
                    <label>Nome Completo</label>
                    <div class="input-com-icone">
                        <span class="input-icone"></span>
                        <input name="form_nome" type="text" placeholder="Ex: João da Silva">
                    </div>
                </div>
            </div>
            <form action="{{url_for('cadastrar_viatura')}}" method="post">
                <div class="form-linha">
                    <div class="form-campo">
                        <label>Cargo / Patente</label>
                        <select name="form_cargo">
                            <option>Selecione a patente</option>
                            <option>Soldado</option>
                            <option>Cabo</option>
                            <option>Sargento</option>
                            <option>Tenente</option>
                            <option>Capitão</option>
                        </select>
                    </div>
                    <div class="form-campo">
                        <label>ID Interno</label>
                        <input type="text" value="# ID-2024-842" disabled class="input-disabled">
                        <small class="input-ajuda">Gerado automaticamente pelo sistema.</small>
                    </div>
                </div>

                <!-- BOTÕES -->
                <div class="form-acoes">
                    <button class="btn-limpar">Limpar Formulário</button>
                    <button class="btn-salvar">Salvar Policial</button>
                </div>
            </form>

        </div>
    </div>

</main>

{% endblock %}
