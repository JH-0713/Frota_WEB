{% extends 'base.html' %}

{% block content %}
<div class="topbar">
    <div>
        <h1>Cadastro de Policial</h1>
        <p class="subtitulo">Insira os dados da novo policial para integrá-la à frota ativa.</p>
    </div>
</div>

<form action="{{url_for('cadastrar_policial')}}" method="post">
    <div class="form-container">

        <div class="form-linha">
            <div class="form-campo">
                <label for="nome">NOME COMPLETO</label>
                <input id="nome" name="form_nome" type="text" placeholder="Ex: Joaquin Gomes da Silva">
            </div>

        </div>
        <div class="form-linha">
            <div class="form-campo">
                <label for="email">E-MAIL</label>
                <input id="email" name="form_email" type="email" placeholder="Ex: j0aqu1n@gmail.com">
            </div>

        </div>
        <div class="form-linha">
            <div class="form-campo">
                <label for="senha">SENHA</label>
                <input id="senha" name="form_senha" type="password" placeholder="Ex: J0@qu1nG0m3s">
            </div>
        </div>

        <div class="form-campo full">
            <label for="form_cargo">CARGO DO POLICIAL
                <a data-bs-toggle="modal" data-bs-target="#cadastro_cargo">
                    <i class="bi bi-plus-circle"></i>
                </a>
            </label>
            <select id="form_cargo" name="form_cargo">
                <option value="None" selected>Selecione o cargo...</option>
                {% for i in var_cargos %}
                <option value="{{i.id_cargo}}">{{i.nome_cargo}}</option>
                {% endfor %}
            </select>
        </div>


        <!-- BOTÃO -->
        <div class="form-acoes">
            <a class="btn-salvar bg-danger" href="{{url_for('listar_responsavel')}}" type="button">Voltar</a>
            <button class="btn-salvar bg-info" type="submit">Salvar Policial</button>
        </div>


    </div>
</form>

<div class="modal fade" id="cadastro_cargo" tabindex="-1"
     aria-labelledby="mostrar_cadastrar_cargo"
     aria-hidden="true">
    <form id="form-editar" action="{{ url_for('cadastrar_cargo') }}"
          method="post">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="mostrar_cadastrar_cargo"><i
                            class="bi bi-pencil-square text-primary fs-6"></i> Cadastar Cargo
                    </h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"
                            aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <label>
                        Nome:
                        <input type="text" name="form_nome">
                    </label>
                    <label>
                        Categoria:
                        <input type="text" name="form_categoria">
                    </label>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-info">Cadastrar
                    </button>
                    <button type="button" class="btn btn-secondary"
                            data-bs-dismiss="modal">Fechar
                    </button>
                </div>
            </div>
        </div>
    </form>
</div>
{% endblock content %}
